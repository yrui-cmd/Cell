name: Validate Cell

on:
  push:
    branches: [main]
  pull_request:

jobs:
  repository:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Python sources
        run: python -m compileall -q install.py skills plugins tests
      - name: Validate repository and installer
        run: python tests/test_repository.py

  open-skills:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install free skill test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Test free skills and routing
        run: python -m pytest -q tests skills/cell-brainstorm/tests skills/cell-plan/tests skills/cell-review/tests skills/cell-reviewer-response/scripts/test_reviewer_docs.py skills/cell-submission/tests skills/cell-data-figure/tests

  powerpoint-plugin:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install plugin test dependencies
        run: python -m pip install pytest -r plugins/cell-ppt-edited/requirements-dev.txt
      - name: Test cell-ppt-edited
        run: python -m pytest -q plugins/cell-ppt-edited/tests
