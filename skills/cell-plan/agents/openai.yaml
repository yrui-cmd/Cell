interface:
  display_name: "Cell · 研究计划安排"
  short_description: "读20篇对标原始研究，直接安排具体研究路线、任务顺序和时间"
  default_prompt: "使用 $cell-plan，根据我的研究题目、投稿目标和现有条件，阅读20篇对标原始研究，直接替我制定研究执行计划。由你确定一条推荐主线，写清具体任务、方法和必要对照、先后顺序、前4周安排及后续阶段。完成规定的全文阅读和关键方法核查后再正式交付。计划只写具体研究安排，文献依据附后，不添加自我免责或模型能力说明，不把尚未完成的文献工作交还给我。不要只给规划方法或多套方案让我选择。"
policy:
  allow_implicit_invocation: true
