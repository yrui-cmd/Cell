interface:
  display_name: "cell_ppt"
  short_description: "PPT 需求确认、资料整理、上传、成品下载和预览"
  default_prompt: "使用 $cell_ppt，必须逐项实际询问全部关键需求，每轮一问并等待用户答复，已有信息也先确认；问答齐备后整理逐页大纲，不生图；将问答、可选模板、资料、PPT内容依序写入 PDF，开头标总页数和模板，逐页以 # 开头并附排版注释，然后准备报价，只上传含页数索引的交接 PDF，按最终 PPT 内容页数报价，确认入队后打开进度面板并立即结束聊天，只留下进度入口；后续下载和预览由后台处理。"
