<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PPT 制作进度</title>
  <style>
    :root { color-scheme: light dark; font-family: system-ui, "Microsoft YaHei", sans-serif;
      background: light-dark(#f8f9fc, #18191e); color: light-dark(#272438, #efedf5); }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; box-sizing: border-box; }
    main { width: min(100%, 480px); }
    header, .details { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
    h1 { margin: 0; font-size: 21px; font-weight: 650; }
    #percent { font-size: 32px; font-variant-numeric: tabular-nums; }
    .track { position: relative; height: 11px; border-radius: 8px; overflow: hidden;
      background: light-dark(#e5e0ef, #35313d); margin: 20px 0 14px; }
    #fill { width: 0; height: 100%; border-radius: 8px; background: light-dark(#6f45b5, #b08aef); transition: width 1s linear; }
    .active::after { content: ""; position: absolute; inset: 0 auto 0 0; width: 28%;
      background: linear-gradient(90deg, transparent, #ffffff66, transparent); animation: sweep 2.5s linear infinite; }
    @keyframes sweep { from { transform: translateX(-100%); } to { transform: translateX(455%); } }
    p, .details { color: light-dark(#625970, #c3bbd0); font-size: 14px; line-height: 1.55; }
    @media (prefers-reduced-motion: reduce) { #fill { transition: none; } .active::after { animation: none; } }
  </style>
</head>
<body>
<main>
  <header><h1 id="label">PPT 制作进度</h1><span id="percent">—</span></header>
  <div id="track" class="track" role="progressbar" aria-label="预计制作进度" aria-valuemin="0" aria-valuemax="100">
    <div id="fill"></div>
  </div>
  <div class="details"><span id="estimate"></span><span id="elapsed"></span></div>
  <p id="queue" aria-live="polite"></p>
  <p id="freshness" aria-live="polite"></p>
  <p id="note" aria-live="polite">正在读取原订单</p>
</main>
<script>
  const el = id => document.getElementById(id);
  function duration(seconds) {
    const rounded = Math.ceil(seconds);
    const hours = Math.floor(rounded / 3600);
    const minutes = Math.floor(rounded % 3600 / 60);
    return (hours ? hours + ' 小时 ' : '') +
      (hours || minutes ? minutes + ' 分钟 ' : '') + rounded % 60 + ' 秒';
  }
  async function update() {
    try {
      const response = await fetch('status', {cache: 'no-store', signal: AbortSignal.timeout(4000)});
      if (!response.ok) throw new Error();
      const s = await response.json();
      el('label').textContent = s.label;
      el('percent').textContent = s.status === 'completed' ? '100%' : s.counting ? '预计 ' + s.percent.toFixed(1) + '%' : '—';
      el('fill').style.width = s.percent + '%';
      el('track').classList.toggle('active', !s.terminal);
      el('track').setAttribute('aria-valuenow', s.percent);
      el('estimate').textContent = '预计制作用时 ' + duration(s.estimate_seconds);
      el('elapsed').textContent = s.counting ? '已制作 ' + duration(s.elapsed_seconds) : '';
      el('queue').textContent = s.queue_text;
      el('freshness').textContent = s.updating ? '状态更新中，暂显示上次查询结果' : '';
      el('note').textContent = s.receiving ? '自动接收原订单成品' :
        s.output_state === 'running' ? '等待 PowerPoint 输出完成' :
        s.terminal ? s.source : !s.counting ? '开始制作后才计时，排队时间不计入预计制作用时' :
          (s.overdue ? '超过预计时间，继续等待' : '预计剩余 ' + duration(s.remaining_seconds));
    } catch {
      el('track').classList.remove('active');
      el('note').textContent = '正在重连本地进度面板';
    } finally {
      setTimeout(update, 2000);
    }
  }
  update();
</script>
</body>
</html>
